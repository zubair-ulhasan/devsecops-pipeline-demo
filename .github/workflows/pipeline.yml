name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline only needs to read code.
permissions:
  contents: read

env:
  TARGET_REPO: zubair-ulhasan/auto_fix_mcp
  # Pinned commit of the target app, so every run scans the same code.
  # Bump it on purpose (see README) rather than tracking a moving branch.
  TARGET_REF: e1e275a62ab157e53e609c91cfd55805d7fa6bc3
  IMAGE: auto-fix-mcp-target:ci
  # gitleaks v8.30.1, pinned by image digest: a tag can be moved, a digest cannot.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # Semgrep 1.183.0 (image digest) and the rule set at a fixed commit (2026-10-21), so findings do not drift.
  SEMGREP_IMAGE: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
  SEMGREP_RULES_REF: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
  # OSV-Scanner v2.7.0, pinned by digest. The advisory data it queries is live and cannot be pinned.
  OSV_IMAGE: ghcr.io/google/osv-scanner@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  # Trivy v0.76.1 and Syft v1.55.0, pinned by digest from GHCR. Both releases are immutable and newer than
  # the fixes for their published advisories. Trivy is never pulled by tag: in March 2026 several Trivy
  # tags and its GitHub Action were briefly malicious (GHSA-69fq-xp46-6x23); digests were not affected.
  # Trivy's vulnerability database is downloaded at run time and cannot be pinned.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  SYFT_IMAGE: ghcr.io/anchore/syft@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a

jobs:
  # Stages 1 and 4. The image scan and SBOM run on the exact image that was just smoke-tested.
  build-and-smoke-test:
    name: build, smoke test, image scan and SBOM
    runs-on: ubuntu-24.04 # pinned so a change to the "latest" runner image cannot alter results
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not tags, so a moved tag cannot change what runs.
      - name: Check out this pipeline repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the target app (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false

      - name: Build the container image
        run: docker build -f docker/Dockerfile.target -t "$IMAGE" .

      - name: Start the container
        run: docker run -d --name target -p 3000:3000 "$IMAGE"

      - name: Smoke test (health endpoint)
        run: bash scripts/smoke-test.sh http://localhost:3000/health

      - name: Export the tested image to a tarball
        # The scanners read this file from a read-only mount, so no scanner needs the docker socket.
        run: |
          mkdir -p artifacts reports cache
          docker save "$IMAGE" -o artifacts/image.tar
          ls -l artifacts/image.tar
          docker image inspect "$IMAGE" --format 'image id: {{.Id}}'

      - name: Generate the SBOM (Syft, CycloneDX JSON)
        run: |
          # The scanner image has no writable /tmp for a non-root user, so give it an in-memory one.
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,mode=1777 -e HOME=/tmp -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "$PWD/artifacts:/in:ro" -v "$PWD/reports:/out" \
            "$SYFT_IMAGE" scan docker-archive:/in/image.tar -o cyclonedx-json=/out/sbom.cdx.json

      - name: Scan the image for vulnerabilities (Trivy)
        # Report-only: --exit-code 0 means findings do not fail the job; a scan error still does.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,mode=1777 -e HOME=/tmp \
            -v "$PWD/artifacts:/in:ro" -v "$PWD/reports:/out" -v "$PWD/cache:/cache" \
            "$TRIVY_IMAGE" image --input /in/image.tar --cache-dir /cache \
            --scanners vuln --format json --output /out/trivy.json --exit-code 0 --no-progress
          echo "--- scanner and vulnerability database versions ---"
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,mode=1777 -e HOME=/tmp -v "$PWD/cache:/cache" \
            "$TRIVY_IMAGE" version --cache-dir /cache

      - name: Log what ran, check the SBOM and summarise the scan
        run: |
          # Reports must exist and be non-trivial; an empty or malformed result is a failure, not a pass.
          test -s reports/sbom.cdx.json || { echo "no SBOM was produced"; exit 1; }
          test -s reports/trivy.json || { echo "no Trivy report was produced"; exit 1; }

          echo "=== SBOM ==="
          fmt="$(jq -r '.bomFormat' reports/sbom.cdx.json)"; spec="$(jq -r '.specVersion' reports/sbom.cdx.json)"
          comps="$(jq '.components | length' reports/sbom.cdx.json)"
          echo "format: $fmt $spec | generator: $(jq -r '[(.metadata.tools.components? // .metadata.tools? // [])[]? | "\(.name) \(.version)"] | join(", ")' reports/sbom.cdx.json) | components: $comps"
          echo "components by package type: $(jq -r '[.components[] | (.purl // "no-purl") | split("/")[0]] | group_by(.) | map("\(.[0])=\(length)") | join(", ")' reports/sbom.cdx.json)"
          echo "components by CycloneDX type: $(jq -r '[.components[] | .type] | group_by(.) | map("\(.[0])=\(length)") | join(", ")' reports/sbom.cdx.json)"
          echo "components with no package URL (first 6): $(jq -r '[.components[] | select(.purl == null)] | .[:6] | map("\(.type):\(.name)") | join(" ; ")' reports/sbom.cdx.json)"
          echo "runtime and other generic components: $(jq -r '[.components[] | select((.purl // "") | startswith("pkg:generic")) | "\(.name)@\(.version)"] | join(", ")' reports/sbom.cdx.json)"
          echo "npm components by location: app=$(jq '[.components[] | select((.purl // "") | startswith("pkg:npm")) | select(any(.properties[]?; (.name | test("location")) and (.value | test("^/?app/node_modules"))))] | length' reports/sbom.cdx.json), elsewhere in the image=$(jq '[.components[] | select((.purl // "") | startswith("pkg:npm")) | select(any(.properties[]?; (.name | test("location")) and (.value | test("^/?app/node_modules"))) | not)] | length' reports/sbom.cdx.json)"
          echo "sample npm component (structure check): $(jq -c '[.components[] | select((.purl // "") | startswith("pkg:npm"))][0] | {name, version, purl, property_names: [.properties[]? | .name]}' reports/sbom.cdx.json)"
          test "$fmt" = "CycloneDX" || { echo "SBOM is not CycloneDX"; exit 1; }
          test "$comps" -gt 0 || { echo "SBOM has no components"; exit 1; }

          echo "=== Trivy ==="
          echo "artifact: $(jq -r '.ArtifactName' reports/trivy.json) | OS: $(jq -r '(.Metadata.OS.Family // "unknown") + " " + (.Metadata.OS.Name // "")' reports/trivy.json)"
          echo "scan targets:"
          jq -r '.Results[]? | "  - \(.Target) | \(.Class) | \(.Type) | \((.Vulnerabilities // []) | length) vulnerabilities"' reports/trivy.json
          total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' reports/trivy.json)"
          bysev="$(jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | map("\(.[0].Severity)=\(length)") | join(", ")' reports/trivy.json)"
          nofix="$(jq '[.Results[]?.Vulnerabilities[]? | select((.FixedVersion // "") == "")] | length' reports/trivy.json)"
          inapp="$(jq '[.Results[]?.Vulnerabilities[]? | select((.PkgPath // "") | test("^/?app/node_modules"))] | length' reports/trivy.json)"
          echo "total: $total ($bysev) | no fix published: $nofix | in the app's own node_modules: $inapp"
          echo "CRITICAL and HIGH (up to 40):"
          jq -r '[.Results[]? | .Target as $t | (.Vulnerabilities // [])[] | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "  - \(.Severity) | \(.VulnerabilityID) | \(.PkgName)@\(.InstalledVersion) | fixed in: \(.FixedVersion // "none") | \(.PkgPath // $t)"] | sort | .[:40][]' reports/trivy.json
          echo "findings in the app's own dependencies, all severities:"
          jq -r '[.Results[]?.Vulnerabilities[]? | select((.PkgPath // "") | test("^/?app/node_modules")) | "  - \(.Severity) | \(.VulnerabilityID) | \(.PkgName)@\(.InstalledVersion) | fixed in: \(.FixedVersion // "none")"] | sort[]' reports/trivy.json
          echo "findings in npm bundled with the base image (/usr/local/lib/node_modules/npm): $(jq '[.Results[]?.Vulnerabilities[]? | select((.PkgPath // "") | test("usr/local/lib/node_modules/npm"))] | length' reports/trivy.json)"
          test "$(jq '.Results | length' reports/trivy.json)" -gt 0 || { echo "Trivy scanned no targets"; exit 1; }
          {
            echo "### Image scan and SBOM (Trivy v0.76.1, Syft v1.55.0)"
            echo
            echo "SBOM: **${comps}** components (CycloneDX ${spec}). Trivy: **${total}** vulnerabilities (${bysev:-none}); ${nofix} have no published fix; ${inapp} are in the app's own dependencies."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the SBOM and the scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-and-scan
          path: |
            reports/sbom.cdx.json
            reports/trivy.json
          retention-days: 14

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs target || true

  # Stage 2. Report-only on purpose: the target is deliberately vulnerable, so findings are
  # expected. Stage 5 adds the quality gate that decides what fails the build.
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the target app (pinned commit, full git history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
          fetch-depth: 0 # secrets can hide in old commits, so scan the history too
          persist-credentials: false

      - name: Scan the target for secrets (gitleaks)
        # Runs as the runner's own user so git trusts the checkout; the repo is mounted read-only.
        # --redact keeps secret values out of the log and the report.
        # --exit-code 0 only means "do not fail on findings"; a scan error still fails the job.
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/target:/repo:ro" -v "$PWD/reports:/reports" \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner \
            --report-format json --report-path /reports/gitleaks.json --exit-code 0

      - name: Summarise the findings
        run: |
          # A scan that produced no report is a failure, not a pass.
          test -s reports/gitleaks.json || { echo "no gitleaks report was produced"; exit 1; }
          count="$(jq length reports/gitleaks.json)"
          echo "gitleaks findings: $count"
          # Also print each finding to the log (rule, location, description; never the secret value).
          jq -r '.[] | "  - \(.RuleID) | \(.File):\(.StartLine) | \(.Description) | commit \(.Commit[0:7])"' reports/gitleaks.json
          {
            echo "### Secrets scan (gitleaks v8.30.1)"
            echo
            echo "Findings: **${count}** (values redacted)"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Rule | File | Line |"
              echo "|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) |"' reports/gitleaks.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
          retention-days: 14

  # Stage 3a. Static analysis (SAST) with Semgrep. Report-only until the stage-5 gate.
  # The scanner image and the rule set are both pinned, so the same code gives the same findings.
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the target app (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false

      - name: Check out the Semgrep rule set (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: ${{ env.SEMGREP_RULES_REF }}
          path: rules
          persist-credentials: false

      - name: Scan the target (Semgrep, JavaScript rules)
        # Both mounts are read-only and telemetry is off. Semgrep exits 0 when it finds issues,
        # so only a real scan error fails this step.
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/target:/src:ro" -v "$PWD/rules:/rules:ro" -v "$PWD/reports:/reports" \
            "$SEMGREP_IMAGE" semgrep scan --config /rules/javascript \
            --metrics=off --disable-version-check \
            --json --output /reports/semgrep.json /src

      - name: Log what ran and summarise the findings
        run: |
          # A scan that produced no report, or scanned no files, is a failure, not a pass.
          test -s reports/semgrep.json || { echo "no semgrep report was produced"; exit 1; }
          scanned="$(jq '(.paths.scanned // []) | length' reports/semgrep.json)"
          findings="$(jq '.results | length' reports/semgrep.json)"
          errors="$(jq '.errors | length' reports/semgrep.json)"
          echo "semgrep $(jq -r '.version' reports/semgrep.json): scanned $scanned files, $findings findings, $errors scan errors"
          echo "files scanned:"
          jq -r '(.paths.scanned // [])[]' reports/semgrep.json | sed 's|^/src/||; s|^|  |'
          echo "findings:"
          jq -r '.results[] | "  - \(.extra.severity) | \(.check_id | split(".") | last) | \(.path | ltrimstr("/src/")):\(.start.line)"' reports/semgrep.json
          if [ "$errors" -gt 0 ]; then
            echo "scan errors:"
            jq -r '.errors[] | "  - \(.type | tostring) \(.path // "")"' reports/semgrep.json
          fi
          test "$scanned" -gt 0 || { echo "semgrep scanned no files"; exit 1; }
          {
            echo "### SAST (Semgrep 1.183.0, rules from commit 16b9e6d)"
            echo
            echo "Scanned **${scanned}** files, **${findings}** findings, ${errors} scan errors."
            if [ "$findings" -gt 0 ]; then
              echo
              echo "| Severity | Rule | Location |"
              echo "|---|---|---|"
              jq -r '.results[] | "| \(.extra.severity) | \(.check_id | split(".") | last) | \(.path | ltrimstr("/src/")):\(.start.line) |"' reports/semgrep.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: reports/semgrep.json
          retention-days: 14

  # Stage 3b. Dependency scan (SCA) with OSV-Scanner on the lockfile. Report-only until stage 5.
  sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the target app (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
          persist-credentials: false

      - name: Scan the lockfile (OSV-Scanner)
        # OSV-Scanner exits 1 when it finds vulnerabilities and 0 when it finds none;
        # any other exit code is a real error and fails the job.
        run: |
          mkdir -p reports
          rc=0
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/target:/repo:ro" \
            "$OSV_IMAGE" scan source --format json -L /repo/package-lock.json \
            > reports/osv.json 2> reports/osv.log || rc=$?
          echo "--- osv-scanner log ---"
          cat reports/osv.log
          echo "--- end log ---"
          echo "osv-scanner exit code: $rc (0 = none found, 1 = vulnerabilities found, other = error)"
          test "$rc" -le 1 || { echo "osv-scanner failed"; exit 1; }

      - name: Log what ran and summarise the findings
        run: |
          test -s reports/osv.json || { echo "no osv-scanner report was produced"; exit 1; }
          # The packages-scanned count only appears in the scanner's own log.
          grep -i -E 'package' reports/osv.log | head -5 || echo "::warning::could not find a packages-scanned line in the osv-scanner log"
          vulnerable="$(jq '[.results[]?.packages[]?] | length' reports/osv.json)"
          advisories="$(jq '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | length' reports/osv.json)"
          echo "vulnerable packages: $vulnerable, distinct advisories: $advisories (advisory data queried $(date -u +%F))"
          jq -r '.results[]?.packages[]? | "  - \(.package.name)@\(.package.version) | \([.vulnerabilities[].id] | .[:5] | join(", ")) | worst score: \(([.groups[]?.max_severity? | select(. != null and . != "") | tonumber] | max) // "n/a")"' reports/osv.json
          {
            echo "### SCA (OSV-Scanner v2.7.0, advisory data queried $(date -u +%F))"
            echo
            echo "Vulnerable packages: **${vulnerable}**, distinct advisories: **${advisories}**."
            if [ "$vulnerable" -gt 0 ]; then
              echo
              echo "| Package | Advisories (first 5) | Worst score |"
              echo "|---|---|---|"
              jq -r '.results[]?.packages[]? | "| \(.package.name)@\(.package.version) | \([.vulnerabilities[].id] | .[:5] | join(", ")) | \(([.groups[]?.max_severity? | select(. != null and . != "") | tonumber] | max) // "n/a") |"' reports/osv.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-report
          path: reports/osv.json
          retention-days: 14
